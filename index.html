<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="dashboard-header">
    <div class="header-clock">
      <div id="clock-display">00:00:00</div>
      <div id="date-display">Senin, 1 Januari 2000</div>
    </div>
    <div class="header-title">🗂️ Life Dashboard</div>
    <button id="theme-toggle" aria-label="Toggle tema terang/gelap">☀️ / 🌙</button>
  </header>

  <main class="dashboard-grid">

    <!-- Greeting Section -->
    <section id="greeting-section" aria-label="Sapaan personal">
      <div class="section-header">
        <span class="section-icon">👋</span>
        <div>
          <h2 class="section-title">Sapaan</h2>
          <p class="section-subtitle">Halo! Siapa namamu hari ini?</p>
        </div>
      </div>
      <div id="greeting-display"></div>
      <div id="name-form">
        <label for="name-input" class="visually-hidden">Nama pengguna</label>
        <input id="name-input" type="text" placeholder="Masukkan nama..." autocomplete="off">
        <button id="name-save">Simpan</button>
      </div>
    </section>

    <!-- Timer Section -->
    <section id="timer-section" aria-label="Focus timer Pomodoro">
      <div class="section-header">
        <span class="section-icon">⏱️</span>
        <div>
          <h2 class="section-title">Focus Timer</h2>
          <p class="section-subtitle">Teknik Pomodoro untuk produktivitas maksimal</p>
        </div>
      </div>
      <div id="timer-display" aria-live="polite">25:00</div>
      <div class="timer-controls">
        <button id="timer-start">▶ Start</button>
        <button id="timer-stop" disabled>⏹ Stop</button>
        <button id="timer-reset">↺ Reset</button>
      </div>
      <div id="duration-form">
        <label for="duration-input" class="visually-hidden">Durasi Pomodoro dalam menit</label>
        <input id="duration-input" type="number" min="1" value="25" aria-describedby="duration-error">
        <button id="duration-save">Set Durasi</button>
        <span id="duration-error" class="error-msg hidden" role="alert"></span>
      </div>
    </section>

    <!-- Todo Section -->
    <section id="todo-section" aria-label="Daftar tugas">
      <div class="section-header">
        <span class="section-icon">✅</span>
        <div>
          <h2 class="section-title">Daftar Tugas</h2>
          <p class="section-subtitle">Catat, kelola, dan selesaikan tugasmu</p>
        </div>
      </div>
      <div id="todo-add-form">
        <label for="todo-input" class="visually-hidden">Tambah tugas baru</label>
        <input id="todo-input" type="text" placeholder="Tambah tugas baru..." autocomplete="off" aria-describedby="todo-error">
        <button id="todo-add">+ Tambah</button>
        <span id="todo-error" class="error-msg hidden" role="alert"></span>
      </div>
      <div id="todo-sort">
        <span class="sort-label">Urutkan:</span>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="az">A–Z</option>
          <option value="za">Z–A</option>
          <option value="incomplete-first">Belum Selesai Dulu</option>
          <option value="complete-first">Selesai Dulu</option>
        </select>
      </div>
      <ul id="task-list" aria-label="Daftar tugas"></ul>
    </section>

    <!-- Quick Links Section -->
    <section id="links-section" aria-label="Quick links">
      <div class="section-header">
        <span class="section-icon">🔗</span>
        <div>
          <h2 class="section-title">Quick Links</h2>
          <p class="section-subtitle">Akses website favoritmu dengan satu klik</p>
        </div>
      </div>
      <div id="links-add-form">
        <label for="link-name-input" class="visually-hidden">Nama link</label>
        <input id="link-name-input" type="text" placeholder="Nama link..." autocomplete="off" aria-describedby="link-error">
        <label for="link-url-input" class="visually-hidden">URL link</label>
        <input id="link-url-input" type="url" placeholder="https://..." aria-describedby="link-error">
        <button id="link-add">+ Tambah</button>
        <span id="link-error" class="error-msg hidden" role="alert"></span>
      </div>
      <div id="links-list" aria-label="Daftar quick links"></div>
    </section>

  </main>

  <div id="notification" class="notification hidden" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
